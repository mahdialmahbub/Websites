name: SEO checks

on:
  pull_request:
  push:
    branches: [main] # change to master if your default branch is master

jobs:
  seo:
    runs-on: ubuntu-latest
    env:
      # The site is built and tested on localhost, so every URL in the
      # sitemap and every canonical points to localhost too
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Production mode, otherwise robots.js blocks the whole site
      NEXT_PUBLIC_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 1) A broken build means nothing else matters
      - name: Build
        run: npm run build

      # 2) Start the production server and wait until it responds
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000 > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000 > /dev/null

      # 3) robots.txt and sitemap.xml exist
      - name: Route validation
        run: |
          curl -fsS http://localhost:3000/robots.txt > /dev/null
          curl -fsS http://localhost:3000/sitemap.xml > /dev/null

      # 4) Metadata, canonical, h1, og:image and JSON-LD on every sitemap URL
      - name: SEO audit
        run: node scripts/seo-audit.mjs http://localhost:3000

      # 5) Broken internal links
      - name: Broken links
        run: node scripts/check-links.mjs http://localhost:3000

      # 6) Sitemap pages that no page links to
      - name: Orphan pages
        run: node scripts/check-orphans.mjs http://localhost:3000

      # 7) Lighthouse: scores for SEO, accessibility and performance
      #    (the server from the "Start server" step is still running)
      - name: Lighthouse CI
        run: npx -y @lhci/cli autorun
